name: test

on:
  push:
  pull_request:
  workflow_call:   # the release workflow runs the same matrix first

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # uv ships its own Python builds, so 3.9 keeps working after runner images drop it
        python: ["3.9", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - run: uv run --no-project --python ${{ matrix.python }} python scripts/demo.py
      - run: uvx pyflakes skills scripts tests
      - name: manifests and hooks are valid JSON
        run: python3 -c "import json; [json.load(open(p)) for p in ('.claude-plugin/plugin.json', '.claude-plugin/marketplace.json', 'hooks/hooks.json', 'examples/settings-snippet.json')]"
      - name: SKILL.md has name and description frontmatter
        run: |
          head -1 skills/session-guide/SKILL.md | grep -qx -- '---'
          grep -q '^name: session-guide$' skills/session-guide/SKILL.md
          grep -q '^description: ' skills/session-guide/SKILL.md
      - name: install.sh round trip
        run: |
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/claude"
          sh install.sh && test -f "$CLAUDE_CONFIG_DIR/skills/session-guide/SKILL.md"
          sh install.sh --uninstall && test ! -e "$CLAUDE_CONFIG_DIR/skills/session-guide"
